<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coniuga — Italian Verb Drill</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Coniuga</h1>
    <div class="topbar-controls">
      <select id="langSwitch" class="lang-switch" aria-label="Language">
        <option value="index.html">🇪🇸 Español</option>
        <option value="index.fr.html">🇫🇷 Français</option>
        <option value="index.it.html" selected>🇮🇹 Italiano</option>
      </select>
      <select id="verbListSize" class="tier-select" aria-label="Verb list size">
        <option value="20">Top 20 verbs</option>
        <option value="50" selected>Top 50 verbs</option>
        <option value="100">Top 100 verbs</option>
      </select>
      <div class="options-wrap">
        <button type="button" id="optionsToggle" class="options-toggle" aria-haspopup="true" aria-expanded="false">⚙ Options</button>
        <div id="optionsPanel" class="options-panel hidden">
          <label class="strict-toggle">
            <input type="checkbox" id="strictAccents">
            Strict accents
          </label>
          <!-- Future: tense-selection checkboxes go here. -->
        </div>
      </div>
      <span id="streak" class="streak" title="Current correct streak">🔥 0</span>
    </div>
  </header>

  <main id="app">
    <div class="stage">
      <div class="session-header">
        <div id="feedback" class="feedback hidden"></div>
        <div class="header-main">
          <span id="headerVerb"></span>
          <span class="header-dot">·</span>
          <span id="headerPronoun"></span>
        </div>
        <div id="headerEnglish" class="header-english muted"></div>
      </div>

      <div class="card-wrap">
        <section id="roundIntro" class="card">
          <p class="eyebrow">Ready?</p>
          <button id="startRoundBtn" class="primary">Start drilling</button>
        </section>

        <section id="drill" class="card hidden">
          <p class="eyebrow" id="tenseLabel">Presente</p>
          <form id="answerForm" autocomplete="off">
            <input id="answerInput" type="text" placeholder="Type the conjugation…" autocomplete="off" autocapitalize="off" spellcheck="false">
            <button type="submit" class="primary" id="checkBtn">Check</button>
          </form>
          <div class="progress-dots" id="progressDots"></div>
        </section>

        <section id="roundSummary" class="card hidden">
          <h2>Round complete</h2>
          <p id="summaryLine" class="muted"></p>
          <button id="nextRoundBtn" class="primary">Next verb</button>
        </section>
      </div>
    </div>
  </main>

  <footer>
    <p class="muted small">Data: Verbiste (GPL-2.0), forms computed from radical+template rules · Progress saved in this browser only</p>
  </footer>

<script src="app.italian.js"></script>
</body>
</html>
