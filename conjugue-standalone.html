<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conjugue — French Verb Drill</title>
<style>
:root {
  --bg: #faf7f2;
  --card: #ffffff;
  --ink: #2a2420;
  --muted: #837a70;
  --accent: #c1502e;
  --accent-ink: #ffffff;
  --good: #2f7d4f;
  --bad: #c1402e;
  --border: #eae3d8;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(40,30,20,0.06), 0 8px 24px rgba(40,30,20,0.06);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1815;
    --card: #262019;
    --ink: #f1ebe2;
    --muted: #a89a89;
    --accent: #e08a5c;
    --accent-ink: #221a12;
    --good: #6fbf8b;
    --bad: #e0725c;
    --border: #3a3128;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.3);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
}

.topbar h1 {
  font-size: 1.25rem;
  margin: 0;
  letter-spacing: -0.01em;
}

.topbar-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 0.5rem 1rem;
  font-size: 0.9rem;
}

.strict-toggle {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
}

.lang-switch,
.tier-select {
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0.3rem 0.6rem;
  font-size: 0.85rem;
  font-family: inherit;
  cursor: pointer;
}

.lang-switch:hover,
.tier-select:hover {
  color: var(--accent);
  border-color: var(--accent);
}

.streak {
  font-weight: 600;
}

main#app {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}

@media (max-width: 600px) {
  main#app {
    align-items: flex-start;
    /* Anchoring near the top (instead of vertically centering) means the
       keyboard shrinking the viewport doesn't re-center everything and
       cause a jump. The extra top padding leaves room for the feedback
       banner, which floats above the header. */
    padding-top: 4.5rem;
  }
}

.stage {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}

.session-header {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 360px;
  text-align: center;
}

.header-main {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.header-dot {
  color: var(--muted);
  font-weight: 400;
  margin: 0 0.35rem;
}

#headerPronoun {
  color: var(--accent);
}

.header-english {
  font-size: 0.9rem;
  font-style: italic;
  margin-top: 0.15rem;
}

.card-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 360px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 2rem 1.75rem;
  width: 100%;
  text-align: center;
}

.card.enter {
  animation: card-enter 0.32s ease both;
}

@keyframes card-enter {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.75rem;
  color: var(--muted);
  margin: 0 0 0.25rem;
}

.card h2 {
  margin: 0 0 1.25rem;
  font-size: 2rem;
}

.muted { color: var(--muted); }
.small { font-size: 0.8rem; }

button.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border: none;
  border-radius: 999px;
  padding: 0.75rem 1.75rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.08s ease;
}

button.primary:hover { transform: translateY(-1px); }
button.primary:active { transform: translateY(0); }

#tenseLabel {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0;
  margin-bottom: 1.5rem;
}

#answerForm {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

#answerInput {
  width: 100%;
  font-size: 1.25rem;
  padding: 0.75rem 1rem;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--ink);
  text-align: center;
}

#checkBtn {
  width: 100%;
}

#answerInput:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.feedback {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  z-index: 0;
  padding: 0.85rem 1rem;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  text-align: center;
  box-shadow: var(--shadow);
}

/* Rests translated up by its own height + a 12px gap, so it always clears
   the header regardless of the header's rendered height. Starts at
   translateY(0) — flush with (behind) the header, since the header has a
   higher z-index — then rises to its resting spot above it. */
.feedback:not(.hidden) {
  animation: feedback-in 0.32s ease both;
}

@keyframes feedback-in {
  from {
    opacity: 0;
    transform: translateY(0);
  }
  60% {
    opacity: 1;
  }
  to {
    opacity: 1;
    transform: translateY(calc(-100% - 12px));
  }
}

.feedback.correct {
  background: color-mix(in srgb, var(--good) 22%, var(--card));
  color: var(--good);
}

.feedback.incorrect {
  background: color-mix(in srgb, var(--bad) 22%, var(--card));
  color: var(--bad);
}

.feedback .correction {
  display: block;
  font-weight: 400;
  color: var(--muted);
  margin-top: 0.35rem;
  font-size: 0.9rem;
}

.progress-dots {
  display: flex;
  justify-content: center;
  gap: 0.4rem;
  margin-top: 1.5rem;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--border);
}

.dot.done-correct { background: var(--good); }
.dot.done-incorrect { background: var(--bad); }
.dot.current { background: var(--accent); }

.hidden { display: none !important; }

footer {
  text-align: center;
  padding: 1rem;
}
</style>
</head>
<body>
  <header class="topbar">
    <h1>Conjugue</h1>
    <div class="topbar-controls">
      <select id="langSwitch" class="lang-switch" aria-label="Language">
        <option value="index.html">🇪🇸 Español</option>
        <option value="index.fr.html" selected>🇫🇷 Français</option>
        <option value="index.it.html">🇮🇹 Italiano</option>
      </select>
      <select id="verbListSize" class="tier-select" aria-label="Verb list size">
        <option value="20">Top 20 verbs</option>
        <option value="50" selected>Top 50 verbs</option>
        <option value="100">Top 100 verbs</option>
      </select>
      <label class="strict-toggle">
        <input type="checkbox" id="strictAccents">
        Strict accents
      </label>
      <span id="streak" class="streak" title="Current correct streak">🔥 0</span>
    </div>
  </header>

  <main id="app">
    <div class="stage">
      <div class="session-header">
        <div id="feedback" class="feedback hidden"></div>
        <div class="header-main">
          <span id="headerVerb"></span>
          <span class="header-dot">·</span>
          <span id="headerPronoun"></span>
        </div>
        <div id="headerEnglish" class="header-english muted"></div>
      </div>

      <div class="card-wrap">
        <section id="roundIntro" class="card">
          <p class="eyebrow">Ready?</p>
          <button id="startRoundBtn" class="primary">Start drilling</button>
        </section>

        <section id="drill" class="card hidden">
          <p class="eyebrow" id="tenseLabel">Présent</p>
          <form id="answerForm" autocomplete="off">
            <input id="answerInput" type="text" placeholder="Type the conjugation…" autocomplete="off" autocapitalize="off" spellcheck="false">
            <button type="submit" class="primary" id="checkBtn">Check</button>
          </form>
          <div class="progress-dots" id="progressDots"></div>
        </section>

        <section id="roundSummary" class="card hidden">
          <h2>Round complete</h2>
          <p id="summaryLine" class="muted"></p>
          <button id="nextRoundBtn" class="primary">Next verb</button>
        </section>
      </div>
    </div>
  </main>

  <footer>
    <p class="muted small">Data: conjugation-fr / Verbiste (GPL-2.0), forms computed from radical+template rules · Progress saved in this browser only</p>
  </footer>

<script>
// Surfaces any uncaught error directly on the page as a visible banner.
// Without this, a script error on a device we can't attach devtools to
// (e.g. a phone) just looks like "nothing happens" with no way to diagnose it.
function showFatalError(message) {
  let banner = document.getElementById("fatalErrorBanner");
  if (!banner) {
    banner = document.createElement("div");
    banner.id = "fatalErrorBanner";
    banner.style.cssText =
      "position:fixed;top:0;left:0;right:0;background:#c1402e;color:#fff;" +
      "padding:0.75rem 1rem;font:13px/1.4 monospace;z-index:9999;white-space:pre-wrap;";
    document.body.prepend(banner);
  }
  banner.textContent = String(message);
}
window.addEventListener("error", (e) => {
  showFatalError(`${e.message} (${(e.filename || "").split("/").pop()}:${e.lineno})`);
});

const MASTERY_KEY = "conjugue_mastery_v1_fr";

  î: "i", ï: "i",
  ô: "o", ö: "o",
  ù: "u", û: "u", ü: "u",
  ç: "c",
};
function foldAccents(s) {
  return s.replace(/[éèêëàâäîïôöùûüç]/g, (c) => ACCENT_FOLD[c]);
}

// Some browsers block localStorage entirely on file:// origins (the
// standalone build is opened by double-clicking, not served), so every
// access is wrapped rather than left to throw.
function safeGet(key) {
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}
function safeSet(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch {
    // progress just won't persist this session
  }
}

function loadMastery() {
  try {
    return JSON.parse(safeGet(MASTERY_KEY)) || {};
  } catch {
    return {};
  }
}
function saveMastery(m) {
  safeSet(MASTERY_KEY, JSON.stringify(m));
}
function recordResult(infinitive, correct) {
  const m = loadMastery();
  const entry = m[infinitive] || { correct: 0, incorrect: 0 };
  if (correct) entry.correct++;
  else entry.incorrect++;
  m[infinitive] = entry;
  saveMastery(m);
}

function getStreak() {
  return parseInt(safeGet(STREAK_KEY) || "0", 10);
}
function setStreak(n) {
  safeSet(STREAK_KEY, String(n));
  document.getElementById("streak").textContent = `🔥 ${n}`;
}

let allVerbs = [];
let verbs = []; // allVerbs filtered down to the selected tier size
let round = null; // { verb, pronoun, tenseIndex, correctCount }
let waitingToAdvance = false;

const els = {
  headerVerb: document.getElementById("headerVerb"),
  headerPronoun: document.getElementById("headerPronoun"),
  headerEnglish: document.getElementById("headerEnglish"),
  startRoundBtn: document.getElementById("startRoundBtn"),
  roundIntro: document.getElementById("roundIntro"),
  drill: document.getElementById("drill"),
  tenseLabel: document.getElementById("tenseLabel"),
  answerForm: document.getElementById("answerForm"),
  answerInput: document.getElementById("answerInput"),
  feedback: document.getElementById("feedback"),
  progressDots: document.getElementById("progressDots"),
  roundSummary: document.getElementById("roundSummary"),
  summaryLine: document.getElementById("summaryLine"),
  nextRoundBtn: document.getElementById("nextRoundBtn"),
  strictAccents: document.getElementById("strictAccents"),
  checkBtn: document.getElementById("checkBtn"),
  langSwitch: document.getElementById("langSwitch"),
  verbListSize: document.getElementById("verbListSize"),
};

function applyTierSize() {
  const tier = parseInt(els.verbListSize.value, 10) || DEFAULT_TIER;
  verbs = allVerbs.filter((v) => v.rank <= tier);
}

function pickWeightedVerb(excludeInfinitive) {
  const mastery = loadMastery();
  const weights = verbs.map((v) => {
    const m = mastery[v.infinitive] || { correct: 0, incorrect: 0 };
    const total = m.correct + m.incorrect;
    const errorRate = total ? m.incorrect / total : 0.5;
    let w = 1 + errorRate * 4;
    if (v.infinitive === excludeInfinitive) w *= 0.15;
    return w;
  });
  const totalWeight = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * totalWeight;
  for (let i = 0; i < verbs.length; i++) {
    r -= weights[i];
    if (r <= 0) return verbs[i];
  }
  return verbs[verbs.length - 1];
}

function pickPronoun() {
  return PRONOUNS[Math.floor(Math.random() * PRONOUNS.length)];
}

function prepareRound() {
  const prevVerb = round ? round.verb.infinitive : null;
  const verb = pickWeightedVerb(prevVerb);
  const pronoun = pickPronoun();
  round = { verb, pronoun, tenseIndex: 0, correctCount: 0 };

  els.headerVerb.textContent = verb.infinitive;
  els.headerPronoun.textContent = pronoun.label;
  els.headerEnglish.textContent = verb.english;

  els.roundSummary.classList.add("hidden");
  els.drill.classList.add("hidden");
  els.roundIntro.classList.remove("hidden");
  playEnter(els.roundIntro);
}

function playEnter(el) {
  el.classList.remove("enter");
  void el.offsetWidth; // restart the CSS animation
  el.classList.add("enter");
}

function buildDots() {
  els.progressDots.innerHTML = "";
  for (let i = 0; i < TOTAL_STEPS; i++) {
    const dot = document.createElement("span");
    dot.className = "dot";
    els.progressDots.appendChild(dot);
  }
}

function updateDot(index, state) {
  const dot = els.progressDots.children[index];
  dot.classList.remove("current", "done-correct", "done-incorrect");
  dot.classList.add(state);
}

function startRound() {
  els.roundIntro.classList.add("hidden");
  els.drill.classList.remove("hidden");
  buildDots();
  showCurrentTense();
  playEnter(els.drill);
}

function showCurrentTense() {
  const idx = round.tenseIndex;
  els.tenseLabel.textContent =
    idx < ACTIVE_TENSES.length ? ACTIVE_TENSES[idx] : EXTRA_FORMS[idx - ACTIVE_TENSES.length].label;
  els.feedback.classList.add("hidden");
  els.feedback.innerHTML = "";
  els.answerInput.value = "";
  els.answerInput.readOnly = false;
  els.answerInput.focus();
  els.checkBtn.textContent = "Check";
  updateDot(round.tenseIndex, "current");
  waitingToAdvance = false;
}

function checkAnswer(userInput, correctForm, strict) {
  const rawUser = userInput.trim().toLowerCase();
  const rawCorrect = correctForm.trim().toLowerCase();
  if (rawUser === rawCorrect) return { correct: true, accentPerfect: true };
  if (strict) return { correct: false, accentPerfect: false };
  if (foldAccents(rawUser) === foldAccents(rawCorrect)) {
    return { correct: true, accentPerfect: false };
  }
  return { correct: false, accentPerfect: false };
}

function submitAnswer() {
  const idx = round.tenseIndex;
  const isExtra = idx >= ACTIVE_TENSES.length;
  const correctForm = isExtra
    ? round.verb[EXTRA_FORMS[idx - ACTIVE_TENSES.length].key]
    : round.verb.forms[ACTIVE_MOOD][ACTIVE_TENSES[idx]][round.pronoun.key];
  const strict = els.strictAccents.checked;
  const result = checkAnswer(els.answerInput.value, correctForm, strict);

  recordResult(round.verb.infinitive, result.correct);
  setStreak(result.correct ? getStreak() + 1 : 0);

  els.feedback.classList.remove("hidden", "correct", "incorrect");
  if (result.correct && result.accentPerfect) {
    els.feedback.classList.add("correct");
    els.feedback.textContent = "Correct !";
  } else if (result.correct) {
    els.feedback.classList.add("correct");
    els.feedback.innerHTML = `Correct ! <span class="correction">Watch the accent: ${correctForm}</span>`;
  } else {
    els.feedback.classList.add("incorrect");
    const hint = isExtra ? correctForm : `${round.pronoun.label} → ${correctForm}`;
    els.feedback.innerHTML = `Not quite <span class="correction">${hint}</span>`;
  }

  updateDot(idx, result.correct ? "done-correct" : "done-incorrect");
  if (result.correct) round.correctCount++;

  els.answerInput.readOnly = true;
  const isLast = idx >= TOTAL_STEPS - 1;
  els.checkBtn.textContent = isLast ? "See results" : "Next tense →";
  waitingToAdvance = true;
}

function advance() {
  round.tenseIndex++;
  if (round.tenseIndex >= TOTAL_STEPS) {
    finishRound();
  } else {
    showCurrentTense();
  }
}

function finishRound() {
  els.drill.classList.add("hidden");
  els.roundSummary.classList.remove("hidden");
  els.summaryLine.textContent = `${round.correctCount} / ${TOTAL_STEPS} correct for "${round.verb.infinitive}"`;
  playEnter(els.roundSummary);
}

els.startRoundBtn.addEventListener("click", startRound);
els.nextRoundBtn.addEventListener("click", () => {
  prepareRound();
});

// Neither button lives in a form, so Enter doesn't reach them by default.
// preventDefault() here also stops a focused button's own native Enter->click
// from firing a second time on top of this (the exact double-fire bug the
// drill screen's Enter handling had earlier).
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (!els.roundIntro.classList.contains("hidden")) {
    e.preventDefault();
    startRound();
  } else if (!els.roundSummary.classList.contains("hidden")) {
    e.preventDefault();
    prepareRound();
  }
});

els.answerForm.addEventListener("submit", (e) => {
  e.preventDefault();
  if (waitingToAdvance) {
    advance();
  } else {
    submitAnswer();
  }
});

els.strictAccents.addEventListener("change", () => {
  safeSet(STRICT_KEY, els.strictAccents.checked ? "1" : "0");
});

els.langSwitch.addEventListener("change", () => {
  window.location.href = els.langSwitch.value;
});

els.verbListSize.addEventListener("change", () => {
  safeSet(TIER_KEY, els.verbListSize.value);
  applyTierSize();
});

function initWithData(data) {
  allVerbs = data.verbs;
  els.strictAccents.checked = safeGet(STRICT_KEY) === "1";
  els.verbListSize.value = safeGet(TIER_KEY) || String(DEFAULT_TIER);
  applyTierSize();
  setStreak(getStreak());
  prepareRound();
}

// The standalone build sets window.EMBEDDED_VERB_DATA before this script
// runs, so it never needs fetch (which fails outright on file:// origins).
if (window.EMBEDDED_VERB_DATA) {
  initWithData(window.EMBEDDED_VERB_DATA);
} else {
  fetch("data/verbs.french.json")
    .then((r) => r.json())
    .then(initWithData)
    .catch((err) => {
      showFatalError("Couldn't load verb data: " + err.message);
      console.error(err);
    });
}

</script>
</body>
</html>
